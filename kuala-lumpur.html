<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KL This Weekend?</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Animated stars background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(2px 2px at 15% 75%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(2px 2px at 85% 15%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 45%, rgba(255,200,100,0.4) 0%, transparent 100%);
      pointer-events: none;
      animation: twinkle 4s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: 0.6; }
      to   { opacity: 1; }
    }

    /* Petronas Towers silhouette */
    .skyline {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 900px;
      opacity: 0.15;
      pointer-events: none;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 60px;
      padding: 40px;
      position: relative;
      z-index: 1;
    }

    .title-wrapper {
      text-align: center;
    }

    .emoji-row {
      font-size: 2.5rem;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 3rem);
      color: #fff;
      text-shadow: 0 0 40px rgba(255, 200, 100, 0.5);
      line-height: 1.3;
      max-width: 700px;
    }

    h1 span {
      color: #ffd700;
    }

    .subtitle {
      margin-top: 12px;
      color: rgba(255,255,255,0.5);
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .buttons {
      display: flex;
      gap: 30px;
      align-items: center;
    }

    .btn {
      padding: 16px 52px;
      font-size: 1.2rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      font-family: 'Inter', sans-serif;
      letter-spacing: 1px;
    }

    #btn-yes {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #1a1a2e;
      box-shadow: 0 8px 30px rgba(255, 200, 0, 0.4);
    }

    #btn-yes:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 40px rgba(255, 200, 0, 0.6);
    }

    #btn-yes:active {
      transform: scale(0.97);
    }

    #btn-no {
      background: transparent;
      color: rgba(255,255,255,0.7);
      border: 2px solid rgba(255,255,255,0.3);
      position: fixed; /* fixed so it can escape anywhere */
      transition: none;
    }

    /* ── Modal overlay ── */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      animation: fadeIn 0.4s ease;
    }

    #modal.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }

    .modal-title {
      font-family: 'Playfair Display', serif;
      color: #ffd700;
      font-size: 1.8rem;
      text-align: center;
    }

    .modal-subtitle {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .video-container {
      position: relative;
      width: min(900px, 95vw);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(255, 200, 0, 0.3);
      background: #000;
    }

    /* 16:9 aspect ratio wrapper */
    .video-container::before {
      content: '';
      display: block;
      padding-top: 56.25%;
    }

    .video-container iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    #close-modal {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 10px 32px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      transition: background 0.2s;
    }

    #close-modal:hover {
      background: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>

  <!-- Petronas SVG silhouette -->
  <svg class="skyline" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
    <!-- Left Tower -->
    <rect x="360" y="60" width="60" height="240" fill="white"/>
    <polygon points="360,60 390,10 420,60" fill="white"/>
    <rect x="370" y="130" width="40" height="10" fill="#0f0c29" opacity="0.5"/>
    <rect x="370" y="155" width="40" height="10" fill="#0f0c29" opacity="0.5"/>
    <rect x="370" y="180" width="40" height="10" fill="#0f0c29" opacity="0.5"/>
    <!-- Right Tower -->
    <rect x="480" y="60" width="60" height="240" fill="white"/>
    <polygon points="480,60 510,10 540,60" fill="white"/>
    <rect x="490" y="130" width="40" height="10" fill="#0f0c29" opacity="0.5"/>
    <rect x="490" y="155" width="40" height="10" fill="#0f0c29" opacity="0.5"/>
    <rect x="490" y="180" width="40" height="10" fill="#0f0c29" opacity="0.5"/>
    <!-- Sky Bridge -->
    <rect x="420" y="155" width="60" height="12" fill="white"/>
    <!-- Surrounding buildings -->
    <rect x="280" y="150" width="50" height="150" fill="white"/>
    <rect x="570" y="130" width="50" height="170" fill="white"/>
    <rect x="200" y="190" width="40" height="110" fill="white"/>
    <rect x="660" y="170" width="40" height="130" fill="white"/>
    <rect x="140" y="210" width="35" height="90" fill="white"/>
    <rect x="725" y="200" width="35" height="100" fill="white"/>
  </svg>

  <div class="content">
    <div class="title-wrapper">
      <div class="emoji-row">🌆✈️🌴</div>
      <h1>Should we go to <span>Kuala Lumpur</span> this weekend?</h1>
      <p class="subtitle">Malaysia · City of Lights</p>
    </div>

    <div class="buttons">
      <button class="btn" id="btn-yes" onclick="openModal()">Yes! 🎉</button>
      <button class="btn" id="btn-no">No</button>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal">
    <p class="modal-subtitle">✨ Great choice! ✨</p>
    <p class="modal-title">The most beautiful places in Kuala Lumpur</p>
    <div class="video-container">
      <!-- KL travel / beautiful places YouTube video -->
      <iframe
        src="https://www.youtube.com/embed/ZRL0Bwt9MoM?autoplay=1&rel=0"
        allow="autoplay; encrypted-media"
        allowfullscreen
        title="Most Beautiful Places in Kuala Lumpur">
      </iframe>
    </div>
    <button id="close-modal" onclick="closeModal()">← Go back</button>
  </div>

  <script>
    /* ── No button runs away ── */
    const noBtn = document.getElementById('btn-no');
    const margin = 20; // px from viewport edges

    // Place the button initially near its natural position
    function initNoBtn() {
      const rect = noBtn.getBoundingClientRect();
      noBtn.style.left = rect.left + 'px';
      noBtn.style.top  = rect.top  + 'px';
    }
    initNoBtn();

    function runAway() {
      const btnW = noBtn.offsetWidth;
      const btnH = noBtn.offsetHeight;
      const maxX = window.innerWidth  - btnW - margin;
      const maxY = window.innerHeight - btnH - margin;

      let newX, newY;
      // Keep trying until we find a spot far from current position
      const currentX = parseFloat(noBtn.style.left);
      const currentY = parseFloat(noBtn.style.top);
      let attempts = 0;
      do {
        newX = margin + Math.random() * maxX;
        newY = margin + Math.random() * maxY;
        attempts++;
      } while (
        attempts < 20 &&
        Math.hypot(newX - currentX, newY - currentY) < 200
      );

      noBtn.style.left = newX + 'px';
      noBtn.style.top  = newY + 'px';
    }

    noBtn.addEventListener('mouseenter', runAway);
    noBtn.addEventListener('mousemove',  runAway);

    // Reposition on resize
    window.addEventListener('resize', () => {
      const btnW = noBtn.offsetWidth;
      const btnH = noBtn.offsetHeight;
      const currentX = Math.min(parseFloat(noBtn.style.left), window.innerWidth  - btnW - margin);
      const currentY = Math.min(parseFloat(noBtn.style.top),  window.innerHeight - btnH - margin);
      noBtn.style.left = Math.max(margin, currentX) + 'px';
      noBtn.style.top  = Math.max(margin, currentY) + 'px';
    });

    /* ── Modal ── */
    function openModal() {
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.remove('active');
      // Stop the video by replacing the iframe src
      const iframe = modal.querySelector('iframe');
      const src = iframe.src;
      iframe.src = '';
      setTimeout(() => iframe.src = src, 200);
    }

    // Close on backdrop click
    document.getElementById('modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
  </script>
</body>
</html>
