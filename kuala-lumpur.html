<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KL This Weekend?</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.55)),
        url('https://images.unsplash.com/photo-1596422846543-75c6fc197f07?auto=format&fit=crop&w=1920&q=90') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      position: relative;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 60px;
      padding: 40px;
      position: relative;
      z-index: 1;
    }

    .title-wrapper { text-align: center; }

    .emoji-row {
      font-size: 2.5rem;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 3rem);
      color: #fff;
      text-shadow: 0 2px 20px rgba(0,0,0,0.8), 0 0 40px rgba(255, 200, 100, 0.3);
      line-height: 1.3;
      max-width: 700px;
    }

    h1 span { color: #ffd700; }

    .subtitle {
      margin-top: 12px;
      color: rgba(255,255,255,0.7);
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    }

    /* ── Buttons row ── */
    .buttons {
      display: flex;
      gap: 24px;
      align-items: center;
      justify-content: center;
    }

    .btn {
      padding: 16px 52px;
      font-size: 1.2rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    #btn-yes {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #1a1a2e;
      box-shadow: 0 8px 30px rgba(255, 200, 0, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    #btn-yes:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 40px rgba(255, 200, 0, 0.6);
    }

    #btn-yes:active { transform: scale(0.97); }

    /* No button: sits in flow until first hover, then escapes to fixed */
    #btn-no {
      background: transparent;
      color: rgba(255,255,255,0.85);
      border: 2px solid rgba(255,255,255,0.5);
      transition: none;
      backdrop-filter: blur(4px);
    }

    #btn-no.escaped {
      position: fixed;
      z-index: 50;
    }

    /* ── Modal overlay ── */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
    }

    #modal.active {
      display: flex;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    .modal-title {
      font-family: 'Playfair Display', serif;
      color: #ffd700;
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      text-align: center;
    }

    .modal-subtitle {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .video-container {
      position: relative;
      width: min(860px, 95vw);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(255, 200, 0, 0.25);
      background: #000;
    }

    .video-container::before {
      content: '';
      display: block;
      padding-top: 56.25%;
    }

    .video-container iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    #close-modal {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 10px 32px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      transition: background 0.2s;
    }

    #close-modal:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>

  <div class="content">
    <div class="title-wrapper">
      <div class="emoji-row">🌆✈️🌴</div>
      <h1>Should we go to <span>Kuala Lumpur</span> this weekend?</h1>
      <p class="subtitle">Malaysia · City of Lights</p>
    </div>

    <div class="buttons">
      <button class="btn" id="btn-yes" onclick="openModal()">Yes! 🎉</button>
      <button class="btn" id="btn-no">No</button>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal">
    <p class="modal-subtitle">✨ Great choice! ✨</p>
    <p class="modal-title">The most beautiful places in Kuala Lumpur</p>
    <div class="video-container">
      <iframe
        id="yt-iframe"
        src=""
        allow="autoplay; encrypted-media; fullscreen"
        allowfullscreen
        playsinline
        title="Most Beautiful Places in Kuala Lumpur">
      </iframe>
    </div>
    <button id="close-modal" onclick="closeModal()">← Go back</button>
  </div>

  <script>
    /* ── No button runs away ── */
    const noBtn  = document.getElementById('btn-no');
    const margin = 20;
    let escaped  = false;

    function runAway() {
      const btnW = noBtn.offsetWidth;
      const btnH = noBtn.offsetHeight;
      const maxX = window.innerWidth  - btnW - margin;
      const maxY = window.innerHeight - btnH - margin;

      const currentX = parseFloat(noBtn.style.left) || 0;
      const currentY = parseFloat(noBtn.style.top)  || 0;
      let newX, newY, attempts = 0;
      do {
        newX = margin + Math.random() * maxX;
        newY = margin + Math.random() * maxY;
        attempts++;
      } while (attempts < 20 && Math.hypot(newX - currentX, newY - currentY) < 200);

      noBtn.style.left = newX + 'px';
      noBtn.style.top  = newY + 'px';
    }

    function escapeAndRun() {
      if (!escaped) {
        const rect = noBtn.getBoundingClientRect();
        noBtn.classList.add('escaped');
        noBtn.style.left  = rect.left + 'px';
        noBtn.style.top   = rect.top  + 'px';
        noBtn.style.width = rect.width + 'px';
        escaped = true;
      }
      runAway();
    }

    noBtn.addEventListener('mouseenter',  escapeAndRun);
    noBtn.addEventListener('touchstart',  escapeAndRun, { passive: true });

    window.addEventListener('resize', () => {
      if (!escaped) return;
      const btnW = noBtn.offsetWidth;
      const btnH = noBtn.offsetHeight;
      noBtn.style.left = Math.min(Math.max(margin, parseFloat(noBtn.style.left)), window.innerWidth  - btnW - margin) + 'px';
      noBtn.style.top  = Math.min(Math.max(margin, parseFloat(noBtn.style.top)),  window.innerHeight - btnH - margin) + 'px';
    });

    /* ── Modal + video ── */
    // Use youtube-nocookie for better iPad/iOS embed compatibility
    const VIDEO_SRC = 'https://www.youtube-nocookie.com/embed/bkzf8LNXL0I?autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1';

    function openModal() {
      const modal  = document.getElementById('modal');
      const iframe = document.getElementById('yt-iframe');
      iframe.src = VIDEO_SRC;
      modal.classList.add('active');
    }

    function closeModal() {
      const modal  = document.getElementById('modal');
      const iframe = document.getElementById('yt-iframe');
      modal.classList.remove('active');
      iframe.src = '';
    }

    document.getElementById('modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
  </script>
</body>
</html>
